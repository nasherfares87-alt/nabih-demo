<style>
:root{
  --ink:#0f172a;

  --line:#e2e8f0;
  --bg:#f8fafc;

  --brand-light:#ccfbf1;
  --purple:#7c3aed;
  --purple-light:#ede9fe;
  --okbg:#dcfce7;
  --okfg:#15803d;
  --wbg:#fef3c7;
  --wfg:#b45309;
  --ebg:#fee2e2;
  --efg:#b91c1c;
  --card-shadow:0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;box-shadow:0 1px 2px 0 rgb(0 0 0 / 0.03)}
.top .in{max-width:1200px;margin:auto;padding:12px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{font-size:24px;font-weight:700;color:var(--brand-dark);display:flex;align-items:center;gap:8px}
.brand span{background:var(--brand);color:#fff;font-size:12px;padding:2px 8px;border-radius:6px;font-weight:600}
.demo-bar{background:linear-gradient(90deg, #0f766e, #0d9488, #7c3aed);color:#fff;font-size:13px;padding:8px 16px;text-align:center;font-weight:500;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.demo-bar button{font:inherit;font-size:12px;background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.4);color:#fff;border-radius:6px;padding:3px 12px;cursor:pointer;transition:.2s}

nav{display:flex;gap:6px;flex-wrap:wrap}
.wrap{max-width:1200px;margin:auto;padding:24px 18px 80px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:20px;box-shadow:var(--card-shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--card-shadow)}
.stat b{display:block;font-size:28px;color:var(--brand);margin-bottom:4px}
.stat.purple b{color:var(--purple)}
h1{font-size:26px;margin:0 0 10px;font-weight:700;color:#0f172a}
h2{font-size:19px;margin:0 0 12px;font-weight:700}
.muted{color:var(--muted);font-size:14px}
button{font:inherit;cursor:pointer;transition:.15s}
.btn{font-weight:600;border:0;border-radius:10px;padding:10px 20px;background:var(--brand);color:#fff;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--brand-dark)}
.btn-purple{background:var(--purple);color:#fff}
.btn-purple:hover{background:#6d28d9}
.btn2{font-weight:600;border:1px solid var(--brand);border-radius:10px;padding:10px 18px;background:#fff;color:var(--brand);min-height:44px}
.btn2:hover{background:var(--brand-light)}
.btn3{font-weight:600;border:1px solid var(--efg);border-radius:10px;padding:10px 18px;background:#fff;color:var(--efg);min-height:44px}

.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 12px;font-weight:600;font-size:13px}
.ok{background:var(--okbg);color:var(--okfg)}.pend{background:var(--wbg);color:var(--wfg)}.bad{background:var(--ebg);color:var(--efg)}.neu{background:#f1f5f9;color:var(--ink)}.purple-badge{background:var(--purple-light);color:var(--purple)}
.banner{border-radius:12px;padding:14px 18px;margin-bottom:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.banner.warn{background:var(--wbg);color:var(--wfg);border:1px solid #fde68a}
.banner.err{background:var(--ebg);color:var(--efg);border:1px solid #fecaca}

.banner.info{background:var(--purple-light);color:var(--purple);border:1px solid #ddd6fe}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input[type=text],input[type=number],input[type=password],input[type=date],select,textarea{width:100%;font:inherit;font-size:15px;padding:10px 14px;border:1px solid #cbd5e1;border-radius:10px;min-height:44px;background:#fff;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #99f6e4;border-color:var(--brand)}
.ltr{direction:ltr;text-align:left}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{background:#f1f5f9;text-align:right;padding:12px 14px;font-weight:600}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.role{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--card-shadow)}
.code{font-size:30px;font-weight:700;letter-spacing:3px;color:var(--brand-dark);direction:ltr;text-align:center;margin:8px 0;font-family:monospace}
.modal{position:fixed;inset:0;background:rgba(15,23,42,0.6);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal .box{background:#fff;border-radius:20px;padding:26px;max-width:700px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 25px -5px rgb(0 0 0 / 0.1)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 24px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:200;max-width:92vw;font-weight:500}
#toast.show{opacity:1}
details{margin-top:24px;background:#f8fafc;padding:14px;border-radius:12px;border:1px solid var(--line)}
summary{cursor:pointer;font-weight:600;color:var(--brand-dark)}

/* أنماط الاستوديو والسندات */
.ad-creator-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media(max-width:850px){.ad-creator-grid{grid-template-columns:1fr}}
.ad-preview-box{background:#f1f5f9;border:2px dashed #cbd5e1;border-radius:16px;padding:16px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:360px}
.ad-canvas-wrap{box-shadow:0 10px 25px -5px rgba(0,0,0,0.15);border-radius:12px;overflow:hidden;max-width:100%;background:#fff}
.ad-canvas-wrap canvas{display:block;max-width:100%;height:auto}

/* تصميم السند المالي الموثق */
.voucher-card{background:#ffffff;border:2px solid var(--brand);border-radius:16px;padding:24px;position:relative;overflow:hidden}
.voucher-card::before{content:"منصة نبيه - معتمد";position:absolute;top:20px;left:-40px;transform:rotate(-45deg);background:var(--brand);color:#fff;font-size:11px;font-weight:700;padding:4px 45px}
.parties-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
.party-box{background:#f8fafc;border:1px solid #cbd5e1;border-radius:12px;padding:12px}

.demo-bar.online-bar{background:linear-gradient(90deg, #059669, #0d9488, #2563eb)}
.demo-bar.offline-bar{background:linear-gradient(90deg, #d97706, #b45309, #7c3aed)}

<script>
const KEY='nabih-platform-v3-agreements';

const $=s=>document.querySelector(s);

/* ---------- ربط خادم نبيه الحقيقي (ASP.NET Core API - Phase 5) ---------- */
const SERVER_HOST = '192.168.100.68:5135';
const API_SERVER = `http://${SERVER_HOST}`;
let API_BASE = localStorage.getItem('nabih_api_base');
if(!API_BASE || API_BASE.includes('localhost')){
  API_BASE = `${API_SERVER}/api`;
  try{ localStorage.setItem('nabih_api_base', API_BASE); }catch(e){}
}
let backendOnline = false;

function openModal(contentHtml){
  closeModal();
  const m=document.createElement('div');
  m.id='activeModal';
  m.className='modal';
  m.innerHTML=`<div class="box">${contentHtml}</div>`;
  m.onclick=(e)=>{if(e.target===m)closeModal()};
  document.body.appendChild(m);
}
function closeModal(){
  const m=$('#activeModal');
  if(m) m.remove();
}

async function checkBackendStatus(){
  try{
    const res=await fetch(`${API_BASE}/Verification/lookup?query=PING`,{
      method:'GET',
      headers:{'Accept':'application/json'},
      signal:AbortSignal.timeout(2000)
    });
    backendOnline=res.status!==0;
  }catch(e){
    backendOnline=false;
  }
  updateConnectionBanner();
  const p=$('#netStatusPill');
  if(p){
    p.className=backendOnline?'badge ok':'badge pend';
    p.textContent=backendOnline?'🟢 الخادم متصل':'🟡 وضع تجريبي';
  }
}

function updateConnectionBanner(){
  const el=$('#connBanner');
  if(!el) return;
  if(backendOnline){
    el.className='demo-bar online-bar';
    el.innerHTML=`
      <span>🟢 <b>متصل بخادم نبيه الحقيقي (ASP.NET Core .NET 10):</b> الاستفسارات، مطابقة الحوالات الآمنة، وسندات Studio تعمل حياً ومباشرة.</span>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button onclick="testQuickSearch('AG-658BA6')">⚡ فحص السند AG-658BA6</button>
        <button onclick="testQuickSearch('NB-ELV49H5')">⚡ فحص السلعة NB-ELV49H5</button>
        <button onclick="checkBackendStatus()">🔄 تحديث</button>
      </div>
    `;
  }else{
    el.className='demo-bar offline-bar';
    el.innerHTML=`
      <span>🟡 <b>وضع المحاكاة التجريبي:</b> خادم الباك-إند غير مشغّل حالياً على <code dir="ltr" style="background:rgba(0,0,0,0.25);padding:2px 6px;border-radius:4px">http://localhost:5135</code>. لشغيل الربط المباشر شغّل <code dir="ltr" style="background:rgba(0,0,0,0.25);padding:2px 6px;border-radius:4px">dotnet run</code> في مجلد nabieh.</span>
      <button onclick="checkBackendStatus()">🔄 إعادة فحص الاتصال</button>
    `;
  }
}

function testQuickSearch(code){

    S.user = 'buyer';
  }
  S.mode = 'buyer';
  S.view = 'dash';
  save();
  render();
  setTimeout(()=>{
    const qi = $('#q');
    if(qi) qi.value = code;
    doSearch(code);
  }, 100);
}

      company:{name:'شركة الإتقان للخدمات والتطوير',idv:true,bankOk:true,iban:'SA77'.padEnd(24,'2222'),type:'COMPANY'}
    },

      {

let S;
try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
if(!S||!S.acc||!S.agreements)S=fresh();
S.tmp={};

function save(){try{const c=Object.assign({},S);delete c.tmp;localStorage.setItem(KEY,JSON.stringify(c))}catch(e){}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),3200)}
const me=()=>S.acc[S.user];
function audit(a){S.audit.unshift({t:new Date().toLocaleTimeString('en-GB'),who:S.user?S.acc[S.user].name:'-',a})}
function go(v){S.view=v;save();render();window.scrollTo(0,0)}
function resetDemo(){try{localStorage.removeItem(KEY)}catch(e){}S=fresh();S.tmp={};render();toast('تمت إعادة ضبط العرض بالبيانات الافتراضية')}
function login(r){S.user=r;S.mode=r==='admin'?null:r;S.view=r==='admin'?'adash':'dash';audit('تسجيل دخول: '+r);save();render()}
function logout(){S.user=null;S.mode=null;S.view='login';S.tmp={};save();render()}
function switchMode(){S.mode=S.mode==='seller'?'buyer':'seller';S.view='dash';S.tmp={};save();render()}
function genCode(p,n){const A='23456789ABCDEFGHJKLMNPQRSTUVWXYZ';let s='';for(let i=0;i<n;i++)s+=A[Math.floor(Math.random()*A.length)];return p+s}
function copyText(t){try{navigator.clipboard.writeText(t);toast('تم النسخ: '+t)}catch(e){toast(t)}}

/* نماذج العلاقات والعمليات للعميل */
const RELATION_MODELS = {
  IND_TO_IND: 'فرد مع فرد (معاملة شخصية)',
  IND_TO_GROUP: 'فرد مع مجموعة أفراد (فاتورة جماعية / قطة)',
  GROUP_TO_GROUP: 'مجموعة أفراد مع مجموعة أخرى',
  IND_TO_ORG: 'فرد مع مؤسسة أو شركة',

  ORG_TO_ORG: 'منشأة مع منشأة أخرى (B2B)',
  SERVICE_PROVIDER: 'جهة مقدمة للخدمة مع المستفيدين'
};

const OPERATION_TYPES = {

  INVESTMENT: 'استثمار / حصة شراكة',

  SUBSCRIPTION: 'اشتراك شهري / التزام دوري',

/* ---------- لوحة التحكم الرئيسية ---------- */
function vDash(){
  if(S.mode==='buyer') return vBuyer();

  const myAgreements=S.agreements.filter(a=>a.createdBy===S.user);
  const myItems=S.items.filter(i=>i.owner===S.user);

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:12px">
      <div>
        <h1 style="margin:0">منصة نبيه | لوحة إدارة التعاملات المالية</h1>

      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">

    </div>

    <!-- البطاقات الإحصائية -->

      <div class="stat purple">
        <b>${myAgreements.length}</b>
        <span>اتفاقات والتزامات مالية نشطة</span>
      </div>
      <div class="stat">
        <b>${myItems.length}</b>
        <span>إعلانات وسلع موثقة</span>
      </div>
      <div class="stat">
        <b>${S.invoices.filter(i=>i.owner===S.user).length}</b>
        <span>فواتير وسندات مصدرة</span>
      </div>
      <div class="stat">
        <b>100%</b>
        <span>حساب بنكي وهوية موثقة</span>
      </div>
    </div>

    <!-- قسم الاتفاقات والالتزامات المالية (طلب العميل الرئيسي) -->
    <div class="card" style="border-right:4px solid var(--purple)">

function saveAgreement(){
  const title=$('#agTitle').value.trim();

  const opType=$('#opType').value;
  const p2Name=$('#p2Name').value.trim();
  const p2Phone=$('#p2Phone').value.trim();
  const amount=parseFloat($('#agAmount').value);
  const dueDate=$('#agDate').value;
  const terms=$('#agTerms').value.trim();

  if(!title||!p2Name||!(amount>0)){
    toast('الرجاء إكمال كافة البيانات الأساسية والمبلغ');
    return;
  }

  const id=++S.seq.agreement;
  let code;
  do{code=genCode('AG-',6)}while(S.agreements.some(a=>a.code===code));

  const newAg={
    id,
    code,
    title,
    relationModel:relModel,
    category:opType,
    creditorName:me().name,
    creditorIban:me().iban,
    debtorName:p2Name,
    debtorPhone:p2Phone,
    amount,
    dueDate,
    terms,
    status:'ACTIVE',
    createdAt:today(),
    createdBy:S.user
  };

  S.agreements.unshift(newAg);
  audit('إصدار اتفاق مالي جديد: '+code+' ('+title+')');
  toast('تم توثيق الاتفاق وإصدار السند والباركود بنجاح!');
  viewAgreement(code);
}

async function verifyAgreementTransfer(code){
  const resBox = $('#transferResultBox');
  const a = S.agreements.find(x => x.code === code) || S.tmp.curAg || { amount: 50000, creditorIban: SELLER_IBAN };
  const enteredIban = normIban($('#ibPay').value);
  const enteredAmount = parseFloat($('#amtPay') ? $('#amtPay').value : a.amount);

  if(!enteredIban || !(enteredAmount > 0)) {
    toast('يرجى إدخال الحساب والمبلغ بشكل صحيح');
    return;
  }

  if(backendOnline){
    if(resBox) resBox.innerHTML = '<div style="padding:16px;text-align:center" class="muted">⏳ جاري التحقق من خادم نبيه ومطابقة البيانات بحسب معايير AC-15...</div>';
    try {
      const res = await fetch(`${API_BASE}/Verification/transfer-code`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          inquiryCode: code,
          enteredIban: enteredIban,
          enteredAmount: enteredAmount,
          purpose: 'سداد التزام مالي موثق'
        })
      });

      const data = await res.json();
      renderTransferResult(data);
      audit(`فحص حوالة لكود ${code}: ${data.status} (${data.transferCode || 'رفض'})`);
      return;
    } catch(e) {
      console.error(e);
      toast('تعذر فحص الحوالة عبر الخادم، جاري الفحص المحلي');
    }
  }

  // المعالجة المحلية الاحتياطية (Fallback)
  const isIbanMatch = (enteredIban === normIban(a.creditorIban));
  const isAmtMatch = (enteredAmount <= a.amount);
  const isExact = (enteredAmount === a.amount);

  if(isIbanMatch && isAmtMatch){
    const dummyCode = 'ST-' + Math.random().toString(36).substring(2,6).toUpperCase();
    renderTransferResult({
      status: 'VERIFIED',
      transferCode: dummyCode,
      amount: enteredAmount,
      maskedPayeeName: maskName(a.creditorName||'أحمد الخالدي'),
      checks: { ibanMatched: true, amountMatched: true, itemOrAgreementActive: true, noActiveSuspension: true },
      warningMessage: isExact ? null : 'تنبيه: المبلغ المدخل جزئي (أقل من إجمالي المستحق في السند).'
    });
    audit('مطابقة محلية ناجحة لتحويل: ' + code);
  } else {
    renderTransferResult({
      status: 'MISMATCH',
      checks: { ibanMatched: isIbanMatch, amountMatched: isAmtMatch, itemOrAgreementActive: true, noActiveSuspension: true },
      warningMessage: !isIbanMatch ? 'الحساب البنكي غير مطابق للحساب المعتمد في السند.' : 'المبلغ المدخل يتجاوز المبلغ المعتمد.'
    });
    audit('محاولة تحويل غير مطابقة: ' + code);
  }
}

async function doSearch(codeOverride){
  const q = (codeOverride || ($('#q') ? $('#q').value : '') || '').trim().toUpperCase();
  if(!q){toast('أدخل رقم استفسار أو باركود');return}

  const qi = $('#q');
  if(qi) qi.value = q;

  // إذا كان الخادم متصلاً، استعلم حياً ومباشرة من خادم نبيه
  if(backendOnline){
    toast('🔍 جاري الاستعلام المباشر من قاعدة بيانات نبيه...');
    try{
      const res=await fetch(`${API_BASE}/Verification/lookup?query=${encodeURIComponent(q)}`);
      if(res.ok){
        const data=await res.json();
        showLookupModal(data);
        audit(`استفسار رسمي عبر الخادم: ${q} (${data.kind})`);
        return;
      }else if(res.status===404){
        toast(`⚠️ المعاملة (${q}) غير موجودة في قاعدة بيانات الخادم.`);
      }
    }catch(e){
      console.error(e);
      toast('تعذر الاتصال بالخادم، جاري البحث المحلي');
    }
  }

  // المعالجة المحلية الاحتياطية (Fallback)
  if(q.startsWith('AG-')){
    const ag=S.agreements.find(x=>x.code===q);
    if(ag){
      viewAgreement(ag.code);
    } else {
      toast('رقم الاتفاق غير مسجل في منصة نبيه!');
    }
  } else {
    // بحث السلع والإعلانات
    S.tmp.activeInq=q;
    openAdStudio(q);
  }
}

async function submitReportToBackend(inquiryCode){
  const name = $('#repName').value.trim();
  const natId = $('#repNatId').value.trim();
  const reason = $('#repReason').value;
  const desc = $('#repDesc').value.trim();

  if(!name || !natId || !desc){
    toast('يرجى تعبئة كافة بيانات البلاغ');
    return;
  }

  if(backendOnline){
    try{
      const res = await fetch(`${API_BASE}/Reports`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          inquiryCode: inquiryCode,
          reporterNationalId: natId,
          reporterName: name,
          reason: reason,
          description: desc
        })
      });

      if(res.ok){
        const data = await res.json();
        closeModal();
        audit(`رفع بلاغ احتيال للمعاملة ${inquiryCode}: ${data.reportId}`);
        toast(`✅ تم رفع البلاغ بنجاح برقم: ${data.reportId}`);
        setTimeout(() => {
          doSearch();
        }, 1200);
        return;
      }
    }catch(e){
      console.error(e);
    }
  }

  // Fallback
  closeModal();
  toast('تم تسجيل البلاغ محلياً للمراجعة.');
}

function renderAdStudio(inqCode){
  const q=S.inq.find(x=>x.code===inqCode)||S.inq[0];
  const it=S.items.find(i=>i.id===q.item);

  const qrDiv=document.createElement('div');
  const targetUrl = backendOnline 
    ? `http://192.168.100.68:5135/api/Verification/lookup?query=${q.code}` 
    : `https://nabih.sa/inq/${q.code}`;
  new QRCode(qrDiv,{
    text: targetUrl,
    width:120,
    height:120,
    colorDark:"#0f172a",
    colorLight:"#ffffff",
    correctLevel:QRCode.CorrectLevel.H
  });

  setTimeout(()=>{
    const qrImg=qrDiv.querySelector('img');
    const canvas=$('#adCanvas');
    if(!canvas) return;
    const ctx=canvas.getContext('2d');
    
    const baseImg=new Image();
    baseImg.crossOrigin='anonymous';
    baseImg.onload=()=>{
      canvas.width=800;
      canvas.height=800;
      ctx.drawImage(baseImg,0,0,800,800);
      
      const barH=180;
      const grad=ctx.createLinearGradient(0,800-barH,0,800);
      grad.addColorStop(0,'rgba(15, 23, 42, 0.88)');
      grad.addColorStop(1,'rgba(15, 23, 42, 0.98)');
      ctx.fillStyle=grad;
      ctx.fillRect(0,800-barH,800,barH);

      ctx.fillStyle="#0d9488";
      ctx.fillRect(0,800-barH,800,5);

      if(qrImg&&qrImg.src){
        const qCanvasImg=new Image();
        qCanvasImg.onload=()=>{
          ctx.fillStyle="#ffffff";
          ctx.beginPath();
          ctx.roundRect(800-160, 800-barH+15, 145, 145, 12);
          ctx.fill();
          ctx.drawImage(qCanvasImg, 800-150, 800-barH+25, 125, 125);
          
          ctx.direction='rtl';
          ctx.textAlign='right';
          
          ctx.fillStyle="#2dd4bf";
          ctx.font="bold 24px 'IBM Plex Sans Arabic', sans-serif";
          ctx.fillText("🛡️ إعلان مسجل ومحمي | منصة نبيه", 800-180, 800-barH+42);
          
          ctx.fillStyle="#ffffff";
          ctx.font="bold 28px monospace";
          ctx.fillText("رقم الاستفسار: "+q.code, 800-180, 800-barH+80);
          
          ctx.fillStyle="#e2e8f0";
          ctx.font="17px 'IBM Plex Sans Arabic', sans-serif";
          ctx.fillText("مدى الموثوقية: موثوقية عالية (هوية + وثيقة ملكية)", 800-180, 800-barH+114);

          ctx.fillStyle="#94a3b8";
          ctx.font="14px 'IBM Plex Sans Arabic', sans-serif";
          ctx.fillText("امسح الباركود أو أدخل الرقم في nabih.sa للتحقق قبل التحويل", 800-180, 800-barH+144);
        };
        qCanvasImg.src=qrImg.src;
      }
    };
    baseImg.src=it.imgUrl || SAMPLE_IMAGES.car;
  },150);
}

function downloadAdImage(){
  const canvas=$('#adCanvas');
  if(!canvas) return;
  const link=document.createElement('a');
  link.download='اعلان_نبيه_'+(S.tmp.activeInq||'ad')+'.png';
  link.href=canvas.toDataURL('image/png');
  link.click();
  toast('تم تحميل صورة الإعلان الموسومة بالباركود بنجاح!');
}

/* ---------- إضافة سلعة جديدة ---------- */
function vAddItem(){
  return `
    <h1>إضافة سلعة جديدة وإصدار إعلان موثق</h1>
    <div class="card" style="max-width:760px">
      <label for="it">اسم ومواصفات السلعة</label>
      <input id="it" type="text" value="لابتوب ماك بوك برو M2">

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div>
          <label for="ic">الفئة</label>
          <select id="ic">
            <option>مركبة</option>
            <option>عقار</option>
            <option selected>أجهزة إلكترونية</option>
            <option>ساعات ومقتنيات</option>
          </select>
        </div>
        <div>
          <label for="ip">السعر المطلوب (ر.س)</label>
          <input id="ip" type="number" value="6500" min="1">
        </div>
      </div>

      <div style="margin-top:20px;display:flex;gap:12px">
        <button class="btn" onclick="saveItem()">إصدار الإعلان وتوليد الباركود</button>
        <button class="btn2" onclick="go('dash')">إلغاء</button>
      </div>
    </div>
  `;
}

function saveItem(){
  const title=$('#it').value.trim();
  const price=parseFloat($('#ip').value);
  if(!title||!(price>0)){toast('أدخل البيانات بشكل صحيح');return}

  const id=++S.seq.item;
  S.items.push({
    id,
    owner:S.user,
    title,
    cat:$('#ic').value,
    price,
    imgUrl:SAMPLE_IMAGES.laptop,
    status:'OWNERSHIP_VERIFIED'
  });

  let code;
  do{code=genCode('NB-',6)}while(S.inq.some(q=>q.code===code));
  S.inq.push({code,item:id,inv:1,status:'ACTIVE',lookups:0});

  toast('تمت إضافة السلعة وتوليد الباركود!');
  openAdStudio(code);
}

  return `
    <div class="top">
      <div class="in">
        <div class="brand">
          🛡️ منصة نبيه <span>النسخة الشاملة</span> ${netPill}
        </div>
        <nav>
          <button class="chip ${S.view==='dash'?'on':''}" onclick="go('dash')">لوحة التعاملات</button>
          <button class="chip ${S.view==='add_agreement'?'on':''}" onclick="go('add_agreement')">🤝 توثيق اتفاق جديد</button>
          <button class="chip ${S.view==='additem'?'on':''}" onclick="go('additem')">🏷️ سلعة جديدة</button>
        </nav>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="muted"><b>${h(a.name)}</b> (${S.mode==='seller'?'دائن/بائع':'طرف مقابل'})</span>

function render(){
  if(!S.user){$('#app').innerHTML=vLogin();return}

    dash:vDash,
    add_agreement:vAddAgreement,
    agreement_voucher:vAgreementVoucher,
    pay_agreement:vPayAgreement,
    additem:vAddItem,
    studio:vStudio
  };
  const fn=V[S.view]||vDash;
  $('#app').innerHTML=header()+'<div class="wrap">'+fn()+'</div>';
}

render();
checkBackendStatus();
setInterval(checkBackendStatus, 15000);
