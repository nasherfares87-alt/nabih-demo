<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منصة نبيه | التحقق وإصدار الفواتير الرقمية</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- مكتبة توليد QR Code داخل المتصفح -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --ink:#0f172a;
  --muted:#475569;
  --line:#e2e8f0;
  --bg:#f8fafc;
  --brand:#0d9488;
  --brand-dark:#0f766e;
  --brand-light:#ccfbf1;
  --okbg:#dcfce7;
  --okfg:#15803d;
  --wbg:#fef3c7;
  --wfg:#b45309;
  --ebg:#fee2e2;
  --efg:#b91c1c;
  --card-shadow:0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;box-shadow:0 1px 2px 0 rgb(0 0 0 / 0.03)}
.top .in{max-width:1150px;margin:auto;padding:12px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{font-size:24px;font-weight:700;color:var(--brand-dark);display:flex;align-items:center;gap:8px}
.brand span{background:var(--brand);color:#fff;font-size:12px;padding:2px 8px;border-radius:6px;font-weight:600}
.demo-bar{background:linear-gradient(90deg, #0f766e, #0d9488);color:#fff;font-size:13px;padding:8px 16px;text-align:center;font-weight:500;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.demo-bar button{font:inherit;font-size:12px;background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.4);color:#fff;border-radius:6px;padding:3px 12px;cursor:pointer;transition:.2s}
.demo-bar button:hover{background:#fff;color:var(--brand-dark)}
nav{display:flex;gap:6px;flex-wrap:wrap}
.wrap{max-width:1150px;margin:auto;padding:24px 18px 80px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:20px;box-shadow:var(--card-shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--card-shadow)}
.stat b{display:block;font-size:30px;color:var(--brand);margin-bottom:4px}
h1{font-size:26px;margin:0 0 10px;font-weight:700;color:#0f172a}
h2{font-size:19px;margin:0 0 12px;font-weight:700}
.muted{color:var(--muted);font-size:14px}
button{font:inherit;cursor:pointer;transition:.15s}
.btn{font-weight:600;border:0;border-radius:10px;padding:10px 20px;background:var(--brand);color:#fff;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--brand-dark)}
.btn2{font-weight:600;border:1px solid var(--brand);border-radius:10px;padding:10px 18px;background:#fff;color:var(--brand);min-height:44px}
.btn2:hover{background:var(--brand-light)}
.btn3{font-weight:600;border:1px solid var(--efg);border-radius:10px;padding:10px 18px;background:#fff;color:var(--efg);min-height:44px}
.btn3:hover{background:var(--ebg)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{font-size:14px;border:1px solid #cbd5e1;border-radius:999px;padding:6px 14px;background:#fff;color:var(--ink);min-height:36px}
.chip:hover{border-color:var(--brand)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 12px;font-weight:600;font-size:13px}
.ok{background:var(--okbg);color:var(--okfg)}.pend{background:var(--wbg);color:var(--wfg)}.bad{background:var(--ebg);color:var(--efg)}.neu{background:#f1f5f9;color:var(--ink)}
.banner{border-radius:12px;padding:14px 18px;margin-bottom:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.banner.warn{background:var(--wbg);color:var(--wfg);border:1px solid #fde68a}
.banner.err{background:var(--ebg);color:var(--efg);border:1px solid #fecaca}
.banner.good{background:var(--okbg);color:var(--okfg);border:1px solid #bbf7d0}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;font:inherit;font-size:15px;padding:10px 14px;border:1px solid #cbd5e1;border-radius:10px;min-height:44px;background:#fff;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #99f6e4;border-color:var(--brand)}
.ltr{direction:ltr;text-align:left}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{background:#f1f5f9;text-align:right;padding:12px 14px;font-weight:600}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.role{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--card-shadow)}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.st{font-size:13px;padding:6px 14px;border-radius:999px;background:#f1f5f9;color:var(--muted);font-weight:500}
.st.on{background:var(--brand);color:#fff}.st.done{background:var(--okbg);color:var(--okfg)}
.num{font-size:64px;font-weight:700;color:var(--brand);text-align:center;margin:14px 0}
.opts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.big{font-size:26px;min-width:90px}
.prev{max-width:240px;max-height:240px;border-radius:14px;border:1px solid var(--line);display:block;margin:12px 0;object-fit:cover}
fieldset{border:1px solid var(--line);border-radius:10px;margin:14px 0;padding:10px 16px}
fieldset label{display:inline-block;margin:6px 14px 6px 0;font-weight:400}
.scan{text-align:center;padding:20px}
.face{width:120px;height:120px;margin:0 auto 14px;border-radius:50%;border:4px solid var(--brand);position:relative;overflow:hidden}
.face:after{content:"";position:absolute;left:0;right:0;height:4px;background:var(--brand);animation:sweep 1.1s linear infinite}
@keyframes sweep{from{top:0}to{top:116px}}
.bar{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;width:0;background:var(--brand);animation:fill 2.2s linear forwards}
@keyframes fill{to{width:100%}}
.code{font-size:32px;font-weight:700;letter-spacing:3px;color:var(--brand-dark);direction:ltr;text-align:center;margin:8px 0;font-family:monospace}
.modal{position:fixed;inset:0;background:rgba(15,23,42,0.6);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal .box{background:#fff;border-radius:20px;padding:26px;max-width:680px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 25px -5px rgb(0 0 0 / 0.1)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 24px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:200;max-width:92vw;font-weight:500;box-shadow:0 10px 15px -3px rgb(0 0 0 / 0.2)}
#toast.show{opacity:1}
details{margin-top:24px;background:#f8fafc;padding:14px;border-radius:12px;border:1px solid var(--line)}
summary{cursor:pointer;font-weight:600;color:var(--brand-dark)}

/* أنماط استوديو توليد كود الإعلان والباركود */
.ad-creator-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media(max-width:850px){.ad-creator-grid{grid-template-columns:1fr}}
.ad-preview-box{background:#f1f5f9;border:2px dashed #cbd5e1;border-radius:16px;padding:16px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:360px}
.ad-canvas-wrap{box-shadow:0 10px 25px -5px rgba(0,0,0,0.15);border-radius:12px;overflow:hidden;max-width:100%;background:#fff}
.ad-canvas-wrap canvas{display:block;max-width:100%;height:auto}
.qr-container{background:#fff;padding:10px;border-radius:10px;display:inline-block;margin:10px auto;border:1px solid var(--line)}
.reliability-meter{display:flex;align-items:center;gap:10px;margin:8px 0}
.reliability-pill{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700}
</style>
</head>
<body>
<div class="demo-bar">
  <span>💡 <b>النموذج الأولي المتكامل لمنصة نبيه:</b> تجربة تفاعلية لمحاكاة إصدار الفواتير، توليد الباركود الموسوم على الإعلان، وفحص الموثوقية.</span>
  <button onclick="resetDemo()">إعادة ضبط العرض 🔄</button>
</div>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const KEY='nabih-platform-v2';
const SEED_IBAN='SA'+'22'.padEnd(22,'4821');
const SELLER_IBAN='SA'+'44'.padEnd(22,'9137');
const OTHER_IBAN='SA'+'99'.padEnd(22,'1111');

// صور تجريبية عالية الجودة للإعلانات
const SAMPLE_IMAGES = {
  car: 'https://images.unsplash.com/photo-1621007947382-bb3c3994e3fb?w=800&auto=format&fit=crop&q=80',
  laptop: 'https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=800&auto=format&fit=crop&q=80',
  phone: 'https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=800&auto=format&fit=crop&q=80',
  watch: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=800&auto=format&fit=crop&q=80'
};

const $=s=>document.querySelector(s);
const h=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('en-US');
const today=()=>new Date().toISOString().slice(0,10);

const ST={
  DRAFT:['neu','مسودة'],
  PENDING_OWNERSHIP:['pend','بانتظار مراجعة الملكية'],
  OWNERSHIP_VERIFIED:['ok','الملكية معتمدة ✅'],
  REJECTED:['bad','مرفوضة ❌'],
  SUSPENDED:['bad','معلّقة بسبب بلاغ ⚠️'],
  SOLD:['ok','مباعة']
};
const LVL={
  HIGH:['ok','مرتفع جداً (موثق رسمياً) ⭐⭐⭐'],
  MEDIUM:['pend','متوسط (إقرار موثق) ⭐⭐'],
  LOW:['bad','منخفض (غير مكتمل الإثبات) ⭐']
};

const maskName=n=>{const p=String(n).split(' ');return p[0]+(p[1]?' '+p[1][0]+'***':'')};
const maskIban=i=>i?'SA•• •••• •••• •••• '+i.slice(-4):'غير مسجّل';
const normIban=s=>String(s).replace(/\s+/g,'').toUpperCase();
const badge=(k,t)=>`<span class="badge ${k}">${t}</span>`;

function fresh(){
  return {
    user:null,
    mode:null,
    view:'login',
    acc:{
      admin:{name:'مشرف منصة نبيه'},
      seller:{name:'أحمد محمد الخالدي',idv:true,bankOk:true,iban:SELLER_IBAN},
      buyer:{name:'منى سعد الشهري',idv:true,bankOk:false,iban:''},
      seed:{name:'خالد العتيبي',idv:true,bankOk:true,iban:SEED_IBAN}
    },
    items:[
      {
        id:1,
        owner:'seller',
        title:'سيارة تويوتا كامري 2022 فل كامل',
        cat:'مركبة',
        price:78000,
        imgUrl:SAMPLE_IMAGES.car,
        adUrl:'https://haraj.com.sa/1182345678',
        status:'OWNERSHIP_VERIFIED'
      }
    ],
    proofs:[
      {id:1,item:1,type:'DOCUMENT',status:'APPROVED',reason:'',text:'رخصة سير المركبة (استمارة) مطابقة للهوية'}
    ],
    invoices:[
      {id:1,no:'INV-000101',type:'SALE',item:1,owner:'seller',buyer:null,total:78000,date:today()}
    ],
    inq:[
      {code:'NB-928471',item:1,inv:1,adUrl:'https://haraj.com.sa/1182345678',status:'ACTIVE',lookups:4}
    ],
    orders:[],
    reports:[],
    codes:[],
    audit:[],
    seq:{item:1,proof:1,inv:1,svc:0,rep:0,code:0}
  };
}

let S;
try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
if(!S||!S.acc||!S.items)S=fresh();
S.tmp={};

function save(){try{const c=Object.assign({},S);delete c.tmp;localStorage.setItem(KEY,JSON.stringify(c))}catch(e){}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),3200)}
const me=()=>S.acc[S.user];
function audit(a){S.audit.unshift({t:new Date().toLocaleTimeString('en-GB'),who:S.user?S.acc[S.user].name:'-',a})}
function go(v){S.view=v;save();render();window.scrollTo(0,0)}
function resetDemo(){try{localStorage.removeItem(KEY)}catch(e){}S=fresh();S.tmp={};render();toast('تمت إعادة ضبط العرض بالبيانات الافتراضية')}
function login(r){S.user=r;S.mode=r==='admin'?null:r;S.view=r==='admin'?'adash':'dash';audit('تسجيل دخول كـ '+r);save();render()}
function logout(){S.user=null;S.mode=null;S.view='login';S.tmp={};save();render()}
function switchMode(){S.mode=S.mode==='seller'?'buyer':'seller';S.view='dash';S.tmp={};save();render()}
function genCode(p,n){const A='23456789ABCDEFGHJKLMNPQRSTUVWXYZ';let s='';for(let i=0;i<n;i++)s+=A[Math.floor(Math.random()*A.length)];return p+s}
function norm(u){try{const x=new URL(u.trim());return x.hostname.replace(/^www\./,'')+x.pathname.replace(/\/$/,'')}catch(e){return null}}
function copyText(t){try{navigator.clipboard.writeText(t);toast('تم النسخ: '+t)}catch(e){toast(t)}}

/* ---------- حساب الموثوقية للإعلان ---------- */
function cred(q){
  const it=S.items.find(i=>i.id===q.item),ow=S.acc[it.owner];
  const pr=S.proofs.filter(p=>p.item===it.id&&p.status==='APPROVED').pop();
  const reps=S.reports.filter(r=>r.status==='UPHELD'&&r.code===q.code).length;
  const doc=pr&&pr.type==='DOCUMENT';
  
  const f=[
    ['هوية البائع',ow.idv?'موثقة عبر خدمة النفاذ الوطني':'غير موثقة',ow.idv?1:0],
    ['إثبات الملكية للسلعة',pr?(doc?'وثيقة ملكية رسمية معتمدة':'إقرار موثق (مسؤولية شخصية)'):'غير معتمد',doc?1:pr?2:0],
    ['الحساب البنكي المعتمد',ow.bankOk?'مطابق بالكامل لاسم الهوية':'غير موثق',ow.bankOk?1:0],
    ['سجل البلاغات والنزاعات',reps?reps+' بلاغ نشط':'سجل نظيف لا توجد بلاغات',reps?0:1]
  ];
  const sc=(ow.idv?1:0)+(ow.bankOk?1:0)+(pr?(doc?2:1):0)-reps*2;
  return{it,ow,f,lvl:sc>=4?'HIGH':sc>=2?'MEDIUM':'LOW',score:sc};
}

/* ---------- استوديو توليد الإعلان الموسوم (Canvas Watermarker) ---------- */
function renderAdStudio(inqCode){
  const q=S.inq.find(x=>x.code===inqCode);
  if(!q) return;
  const it=S.items.find(i=>i.id===q.item);
  const cInfo=cred(q);
  const lvlText=cInfo.lvl==='HIGH'?'موثوقية عالية (هوية + وثيقة ملكية)':cInfo.lvl==='MEDIUM'?'موثوقية متوسطة (إقرار موثق)':'قيد التحقق';

  // 1. توليد QR Code مخفي لقراءته في الكانفاس
  const qrDiv=document.createElement('div');
  new QRCode(qrDiv,{
    text:'https://nabih.sa/inq/'+q.code,
    width:120,
    height:120,
    colorDark:"#0f172a",
    colorLight:"#ffffff",
    correctLevel:QRCode.CorrectLevel.H
  });

  setTimeout(()=>{
    const qrImg=qrDiv.querySelector('img');
    const canvas=$('#adCanvas');
    if(!canvas) return;
    const ctx=canvas.getContext('2d');
    
    // تحميل صورة السلعة ورسم الشريط الرسمي
    const baseImg=new Image();
    baseImg.crossOrigin='anonymous';
    baseImg.onload=()=>{
      // أبعاد قياسية للإعلان (1080x1080 مربع)
      canvas.width=800;
      canvas.height=800;
      
      // رسم الصورة الأصلية
      ctx.drawImage(baseImg,0,0,800,800);
      
      // رسم خلفية شريط الحماية السفلي المتدرج
      const barH=180;
      const grad=ctx.createLinearGradient(0,800-barH,0,800);
      grad.addColorStop(0,'rgba(15, 23, 42, 0.88)');
      grad.addColorStop(1,'rgba(15, 23, 42, 0.98)');
      ctx.fillStyle=grad;
      ctx.fillRect(0,800-barH,800,barH);

      // خط فاصل علوي للشريط بلون المنصة
      ctx.fillStyle="#0d9488";
      ctx.fillRect(0,800-barH,800,5);

      // رسم الـ QR Code
      if(qrImg&&qrImg.src){
        const qCanvasImg=new Image();
        qCanvasImg.onload=()=>{
          // خلفية بيضاء للـ QR
          ctx.fillStyle="#ffffff";
          ctx.beginPath();
          ctx.roundRect(800-160, 800-barH+15, 145, 145, 12);
          ctx.fill();
          ctx.drawImage(qCanvasImg, 800-150, 800-barH+25, 125, 125);
          
          // نصوص التوثيق
          ctx.direction='rtl';
          ctx.textAlign='right';
          
          // شعار نبيه واسم الخدمة
          ctx.fillStyle="#2dd4bf";
          ctx.font="bold 24px 'IBM Plex Sans Arabic', sans-serif";
          ctx.fillText("🛡️ إعلان مسجل ومحمي | منصة نبيه", 800-180, 800-barH+42);
          
          // رقم الاستفسار الموحد
          ctx.fillStyle="#ffffff";
          ctx.font="bold 28px monospace";
          ctx.fillText("رقم الاستفسار: "+q.code, 800-180, 800-barH+80);
          
          // الموثوقية
          ctx.fillStyle="#e2e8f0";
          ctx.font="17px 'IBM Plex Sans Arabic', sans-serif";
          ctx.fillText("مدى الموثوقية: "+lvlText, 800-180, 800-barH+114);

          // رسالة للمشتري
          ctx.fillStyle="#94a3b8";
          ctx.font="14px 'IBM Plex Sans Arabic', sans-serif";
          ctx.fillText("امسح الباركود أو أدخل الرقم في nabih.sa للتحقق من الفاتورة قبل التحويل", 800-180, 800-barH+144);
        };
        qCanvasImg.src=qrImg.src;
      }
    };
    baseImg.src=it.imgUrl || SAMPLE_IMAGES.car;
  },150);
}

function downloadAdImage(){
  const canvas=$('#adCanvas');
  if(!canvas) return;
  const link=document.createElement('a');
  link.download='اعلان_نبيه_'+(S.tmp.activeInq||'ad')+'.png';
  link.href=canvas.toDataURL('image/png');
  link.click();
  toast('تم تحميل صورة الإعلان الموسومة بالباركود بنجاح!');
}

/* ---------- شاشات البائع ---------- */
function vSeller(){
  const a=me();
  const mine=S.items.filter(i=>i.owner===S.user);
  const rows=mine.map(it=>{
    const q=S.inq.find(x=>x.item===it.id);
    const pr=S.proofs.filter(p=>p.item===it.id).pop();
    const s=ST[it.status];
    let act='';
    if(it.status==='OWNERSHIP_VERIFIED'&&!q){
      act=`<button class="btn" onclick="issueInv(${it.id})">إصدار الفاتورة وتوليد الباركود</button>`;
    } else if(it.status==='REJECTED'){
      act=`<span class="muted">${h(pr&&pr.reason)}</span> <button class="btn2" onclick="resubmit(${it.id})">إعادة تقديم</button>`;
    } else if(q){
      act=`
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          <span class="badge ${q.status==='ACTIVE'?'ok':'bad'}">${q.status==='ACTIVE'?'الرقم فعّال':'معلّق'}</span>
          <b dir="ltr" style="font-family:monospace">${q.code}</b>
          <button class="btn" style="padding:6px 12px;font-size:13px;min-height:34px" onclick="openAdStudio('${q.code}')">🖼️ صورة الإعلان بالباركود</button>

function uploadAdImg(input,itemId){
  if(input.files&&input.files[0]){

    reader.onload=e=>{

  }
}

function saveItem(){
  const title=$('#it').value.trim();
  const price=parseFloat($('#ip').value);
  const url=$('#iu').value.trim();
  const pt=$('#pt').value;
  const dec=$('#pd')?$('#pd').value.trim():'';
  const imgUrl=$('#sampleImgSel').value;

  if(!title||!(price>0)){toast('الرجاء إدخال اسم السلعة والسعر بشكل صحيح');return}

  const id=++S.seq.item;
  const pid=++S.seq.proof;

  // إضافة السلعة بحالة معتمدة مباشرة للتجربة (أو قيد المراجعة)
  S.items.push({
    id,
    owner:S.user,
    title,
    cat:$('#ic').value,
    price,
    imgUrl,
    adUrl:url,
    status:'OWNERSHIP_VERIFIED' // نعتمدها مباشرة ليسهل على العميل تجربة توليد الباركود فوراً
  });

  S.proofs.push({
    id:pid,
    item:id,
    type:pt,
    status:'APPROVED',
    reason:'',
    text:pt==='DECLARATION'?dec:'مستند إثبات ملكية معتمد'
  });

  audit('إضافة سلعة جديدة واعتماد الملكية: '+title);

  // إصدار الفاتورة وتوليد الباركود تلقائياً
  issueInv(id);
}

function issueInv(id){
  const a=me();
  const it=S.items.find(i=>i.id===id);
  if(!it) return;

  const iid=++S.seq.inv;
  const inv={
    id:iid,
    no:'INV-'+String(iid).padStart(6,'0'),
    type:'SALE',
    item:id,
    owner:S.user,
    buyer:null,
    total:it.price,
    date:today()
  };
  S.invoices.push(inv);

  let code;
  do{code=genCode('NB-',6)}while(S.inq.some(q=>q.code===code));
  
  S.inq.push({
    code,
    item:id,
    inv:iid,
    adUrl:it.adUrl,
    status:'ACTIVE',
    lookups:0
  });

  audit('إصدار فاتورة بيع '+inv.no+' ورقم استفسار موحد '+code);
  openAdStudio(code);
}

function doSearch(){
  const q=($('#q').value||'').trim();
  if(!q){toast('الرجاء إدخال رقم استفسار أو رابط');return}

  const r={q};
  if(/^NB-/i.test(q)){
    r.kind='number';
    r.inq=S.inq.find(x=>x.code.toUpperCase()===q.toUpperCase())||null;
  } else {
    r.kind='link';
    const n=norm(q);
    r.inq=S.inq.find(x=>x.adUrl&&norm(x.adUrl)===n)||null;
  }

  if(r.inq){
    r.inq.lookups++;
    const it=S.items.find(i=>i.id===r.inq.item);
    r.item=it;
  }
  S.tmp.res=r;
  save();
  go('result');
}

  const it=S.items.find(i=>i.id===q.item);
  const ow=S.acc[it.owner];

  const amt=parseFloat($('#am').value);
  const pur=$('#pu').value.trim();
  const ib=normIban($('#ib2').value);

  if(!(amt>0)||!pur||!ib){toast('الرجاء تعبئة جميع الحقول');return}

  const ck=[
    ['رقم الآيبان يطابق حساب البائع الموثق بالهوية', ib===ow.iban],
    ['المبلغ لا يتجاوز قيمة الفاتورة المعتمدة ('+fmt(it.price)+' ر.س)', amt<=it.price],
    ['رقم الاستفسار نشط وساري ولا توجد عليه بلاغات', q.status==='ACTIVE'],
    ['تم تحديد غرض واضح للحوالة', !!pur]
  ];

  const rec={
    id:++S.seq.code,
    code:genCode('TR-',5),
    buyer:S.user,
    inq:q.code,
    iban:ib,
    amount:amt,
    purpose:pur,
    ck,
    status:ck.every(x=>x[1])?'VERIFIED':'MISMATCH'
  };

  S.codes.push(rec);
  S.tmp.codeId=rec.id;
  audit('إنشاء عملية فحص تحويل '+rec.code+' ('+rec.status+')');
  save();
  go('chk');
}

function vChk(){
  const r=S.codes.find(c=>c.id===S.tmp.codeId);
  const okAll=r.status!=='MISMATCH';

  return `
    <h1>نتيجة فحص بيانات الحوالة قبل التحويل</h1>
    <div class="card" style="max-width:720px">
      <div style="text-align:center;margin-bottom:16px">
        <div class="muted">رمز العملية الآمنة</div>
        <div class="code">${r.code}</div>
      </div>

      <div class="row"><span class="muted">الحساب المستهدف:</span><b dir="ltr">${maskIban(r.iban)}</b></div>
      <div class="row"><span class="muted">المبلغ:</span><b>${fmt(r.amount)} ر.س</b></div>
      <div class="row"><span class="muted">الغرض:</span><b>${h(r.purpose)}</b></div>

      <h3 style="margin-top:20px">تقرير المطابقة الآلية</h3>
      ${r.ck.map(x=>`
        <div class="row">
          <span>${x[0]}</span>
          ${badge(x[1]?'ok':'bad',x[1]?'متطابق ✅':'غير متطابق ❌')}
        </div>
      `).join('')}

      ${okAll?`
        <div class="banner good" style="margin-top:20px">
          <div>
            <b>البيانات متطابقة وآمنة للتحويل!</b>
            <p style="margin:4px 0 0">يمكنك الآن إتمام الحوالة بأمان من تطبيق البنك الخاص بك إلى حساب البائع المعتمد مباشرة.</p>
          </div>
          <button class="btn" onclick="go('dash')">إنهاء والعودة للوحة</button>
        </div>
      `:`
        <div class="banner err" style="margin-top:20px">
          <div>
            <b>⚠️ تحذير شديد الخطورة: البيانات غير متطابقة!</b>
            <p style="margin:4px 0 0">الحساب البنكي الذي تم إدخاله لا يخص المالك الموثق للسلعة في منصة نبيه. لا تقم بالتحويل أبداً.</p>
          </div>
          <button class="btn3" onclick="go('code')">تعديل البيانات</button>
        </div>
      `}
    </div>
  `;
}

/* ---------- لوحة المشرف ---------- */
function vAdmin(){
  const pend=S.proofs.filter(p=>p.status==='UNDER_REVIEW');
  const openR=S.reports.filter(r=>r.status==='SUBMITTED');

  return `
    <h1>لوحة إدارة المنصة (مشرف النظام)</h1>
    <div class="grid">
      <div class="stat"><b>${pend.length}</b>إثباتات تنتظر الفحص</div>
      <div class="stat"><b>${openR.length}</b>بلاغات واردة</div>
      <div class="stat"><b>${S.inq.filter(q=>q.status==='ACTIVE').length}</b>أرقام استفسار نشطة</div>
      <div class="stat"><b>${S.invoices.length}</b>إجمالي الفواتير</div>
    </div>

    <div class="card">
      <h2>مراجعة إثباتات الملكية</h2>
      ${pend.length?`
        <div class="tw">
          <table>
            <thead><tr><th>السلعة</th><th>المالك</th><th>نوع الإثبات</th><th>الإجراء</th></tr></thead>
            <tbody>
              ${pend.map(p=>{
                const it=S.items.find(i=>i.id===p.item);
                return `
                  <tr>
                    <td><b>${h(it.title)}</b></td>
                    <td>${h(S.acc[it.owner].name)}</td>
                    <td>${h(p.text)}</td>
                    <td><button class="btn" onclick="approveProof(${p.id})">اعتماد</button></td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `:'<p class="muted">لا توجد طلبات إثبات ملكية معلقة حالياً.</p>'}
    </div>

    <div class="card">
      <h2>سجل التدقيق والعمليات (Audit Log)</h2>
      <div class="tw">
        <table>
          <thead><tr><th>العملية</th><th>المنفذ</th><th>الوقت</th></tr></thead>
          <tbody>
            ${S.audit.slice(0,8).map(a=>`
              <tr><td><b>${h(a.a)}</b></td><td>${h(a.who)}</td><td dir="ltr">${a.t}</td></tr>
            `).join('')||'<tr><td colspan="3" class="muted">لا توجد عمليات مسجلة</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

/* ---------- الفواتير والبلاغات والمشترك ---------- */
function vInvoices(){
  const list=S.invoices.filter(i=>S.mode==='seller'?i.owner===S.user:true);
  return `
    <h1>الفواتير الصادرة في النظام</h1>
    <div class="card">
      ${list.length?`
        <div class="tw">
          <table>
            <thead><tr><th>رقم الفاتورة</th><th>التاريخ</th><th>المبلغ</th><th>الحالة</th><th></th></tr></thead>
            <tbody>
              ${list.map(i=>`
                <tr>
                  <td dir="ltr"><b>${i.no}</b></td>
                  <td>${i.date}</td>
                  <td><b>${fmt(i.total)} ر.س</b></td>
                  <td>${badge('ok','رسمية صادرة')}</td>
                  <td><button class="chip" onclick="S.tmp.modal=${i.id};render()">عرض الفاتورة</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `:'<p class="muted">لا توجد فواتير بعد.</p>'}
    </div>
  `;
}

function vReport(){
  return `
    <h1>تقديم بلاغ اشتباه أو حماية ملكية</h1>
    <div class="card" style="max-width:680px">
      <p class="muted">نحمي أصحاب السلع من عرض معروضاتهم دون إذن، ونحمي المشترين من الإعلانات المشبوهة:</p>
      
      <label for="rt">رابط الإعلان أو رقم الاستفسار المشبوه</label>
      <input id="rt" type="text" class="ltr" value="${h(S.tmp.repTarget||'https://haraj.com.sa/1182345678')}">

      <label for="rs">سبب البلاغ بالتفصيل</label>
      <textarea id="rs" placeholder="مثال: هذا الإعلان يستخدم صور سيارتي دون إذني، أو البائع يطلب تحويلاً لحساب مختلف..."></textarea>

      <div style="margin-top:16px;display:flex;gap:10px">
        <button class="btn" onclick="sendReport()">إرسال البلاغ للمراجعة الفورية</button>
        <button class="btn2" onclick="go('dash')">إلغاء</button>
      </div>
    </div>
  `;
}

function sendReport(){
  const tg=$('#rt').value.trim();
  const rs=$('#rs').value.trim();
  if(!tg||!rs){toast('الرجاء إكمال بيانات البلاغ');return}

  S.reports.push({
    id:++S.seq.rep,
    kind:S.mode==='seller'?'OWNER':'BUYER',
    target:tg,
    reason:rs,
    by:S.user,
    status:'SUBMITTED'
  });

  audit('تقديم بلاغ: '+tg);
  toast('تم تقديم البلاغ وسيتم تعليق الإعلان إذا تبينت المخالفة');
  S.tmp.repTarget='';
  go('dash');
}

function vInvModal(){
  const i=S.invoices.find(x=>x.id===S.tmp.modal);
  if(!i) return '';
  const it=i.item&&S.items.find(x=>x.id===i.item);
  const ow=i.owner&&S.acc[i.owner];

  return `
    <div class="modal" onclick="if(event.target===this){S.tmp.modal=null;render()}">
      <div class="box">
        <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px">
          <h2 style="margin:0;color:var(--brand-dark)">فاتورة بيع رقمية معتمدة | ${i.no}</h2>
          ${badge('ok','مطابقة للأنظمة')}
        </div>
        <div class="row"><span class="muted">تاريخ الإصدار:</span><b>${i.date}</b></div>
        <div class="row"><span class="muted">الطرف الأول (البائع المالك):</span><b>${ow?h(ow.name):'منصة نبيه'}</b></div>
        ${it?`<div class="row"><span class="muted">السلعة المعروضة:</span><b>${h(it.title)}</b></div>`:''}
        <div class="row"><span class="muted">إجمالي المبلغ:</span><b style="font-size:20px;color:var(--brand)">${fmt(i.total)} ر.س</b></div>
        <div class="row"><span class="muted">الحساب البنكي المعتمد:</span><b dir="ltr">${ow?maskIban(ow.iban):'-'}</b></div>
        <p class="muted" style="font-size:13px;margin-top:14px">تعتبر هذه الفاتورة سنداً توثيقياً لملكية وعرض السلعة ومطابقة الحساب البنكي للبائع داخل منصة نبيه.</p>
        <div style="text-align:left;margin-top:18px">
          <button class="btn" onclick="S.tmp.modal=null;render()">إغلاق</button>
        </div>
      </div>
    </div>
  `;
}

/* ---------- شاشة الدخول والهيكل العام ---------- */
function vLogin(){
  return `
    <div class="wrap" style="max-width:960px">
      <div style="text-align:center;margin-bottom:30px">
        <h1 style="font-size:32px;color:var(--brand-dark)">منصة نبيه | التوثيق والفوترة الرقمية للإعلانات</h1>
        <p class="muted" style="font-size:16px;max-width:700px;margin:auto">
          المنصة الأولى لربط إعلانات السلع بالمالك الحقيقي، إصدار فواتير بيع معتمدة، وتوليد باركود ورقم استفسار موحد يُطبع على صورة الإعلان لمنع الاحتيال المالي.
        </p>
      </div>

      <div class="roles">
        <div class="role">
          <h2>بائع: أحمد الخالدي</h2>
          <p class="muted">يمتلك سلعاً موثقة بالهوية والحساب البنكي، ويقوم بإصدار فواتير بيع وتوليد صور الإعلانات الموسومة بالباركود.</p>
          <button class="btn" onclick="login('seller')">الدخول كبائع (تجربة إصدار إعلان)</button>
        </div>

        <div class="role">
          <h2>مشتري: منى الشهري</h2>
          <p class="muted">تتصفح الإعلانات وتفحص أرقام الاستفسار والباركود، وتطابق الحساب البنكي قبل التحويل عبر آلية «استقبل وحوّل».</p>
          <button class="btn2" onclick="login('buyer')">الدخول كمشتري (فحص إعلان)</button>
        </div>

        <div class="role">
          <h2>مشرف المنصة</h2>
          <p class="muted">مراجعة وثائق الملكية، البلاغات الواردة، وسجل التدقيق لضمان سلامة التعاملات.</p>
          <button class="btn3" onclick="login('admin')">الدخول كمشرف</button>
        </div>
      </div>

      <details>
        <summary>💡 كيف تقدم هذا النموذج أمام العميل؟ (سيناريو العرض)</summary>
        <ol style="line-height:1.9">
          <li><b>ابدأ كبائع:</b> اضغط على «صورة الإعلان بالباركود» لتري العميل كيف يقوم النظام بدمج الباركود ورقم الاستفسار والموثوقية على صورة السيارة تلقائياً مع إمكانية تحميلها ونشرها في حراج أو تيك توك.</li>
          <li><b>أضف سلعة جديدة:</b> لتريه سهولة إدخال إعلان جديد، إرفاق إثبات الملكية، وإصدار الفاتورة الفورية.</li>
          <li><b>انتقل كمشتري:</b> قم بفحص رقم الاستفسار <span dir="ltr">NB-928471</span> أو الصق رابط الإعلان لتظهر بطاقة الفحص ومستوى الموثوقية.</li>
          <li><b>استعرض آلية «استقبل وحوّل»:</b> أظهر للعميل كيف يكتشف النظام الحسابات البنكية المحتالة إذا اختلفت عن حساب المالك الحقيقي.</li>
        </ol>
      </details>
    </div>
  `;
}

function header(){
  if(!S.user) return '';
  const a=me();
  const adm=S.user==='admin';
  return `
    <div class="top">
      <div class="in">
        <div class="brand">
          🛡️ منصة نبيه <span>نسخة تفاعلية متقدمة</span>
        </div>
        ${adm?'':`
          <nav>
            <button class="chip ${S.view==='dash'?'on':''}" onclick="go('dash')">لوحة التحكم</button>
            <button class="chip ${S.view==='invoices'?'on':''}" onclick="go('invoices')">الفواتير</button>
            <button class="chip ${S.view==='report'?'on':''}" onclick="go('report')">البلاغات</button>
          </nav>
        `}
        <div style="display:flex;align-items:center;gap:10px">
          <span class="muted"><b>${h(a.name)}</b> (${adm?'مشرف':S.mode==='seller'?'بائع':'مشتري'})</span>
          ${adm?'':`<button class="btn2" style="min-height:36px;padding:4px 12px;font-size:13px" onclick="switchMode()">تبديل إلى ${S.mode==='seller'?'مشتري':'بائع'}</button>`}
          <button class="chip" onclick="logout()">خروج</button>
        </div>
      </div>
    </div>
  `;
}

function render(){
  if(!S.user){$('#app').innerHTML=vLogin();return}
  const V={
    dash:S.mode==='seller'?vSeller:vBuyer,
    adash:vAdmin,
    additem:vAddItem,
    studio:vStudio,
    result:vResult,
    code:vCode,
    chk:vChk,
    invoices:vInvoices,
    report:vReport
  };
  const fn=V[S.view]||(S.user==='admin'?vAdmin:V.dash);
  $('#app').innerHTML=header()+'<div class="wrap">'+fn()+'</div>'+(S.tmp.modal?vInvModal():'');
}

render();
</script>
</body>
</html>
